<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Lab — Thư viện bài học IELTS Speaking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Noto+Serif:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#081527; --panel:#0f2547; --panel2:#143058; --line:#1e406e;
    --ink:#eaf3ff; --mut:#9db8d9; --sky:#38b6e8; --gold:#f2b64b; --green:#3ecf7a;
    --p1:#38b6e8; --p2:#b78ae8; --p3:#f28a5c; --ps:#3ecf7a;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:radial-gradient(1100px 500px at 50% -80px,#12325f,var(--bg));color:var(--ink);
       font-family:"Be Vietnam Pro",system-ui,sans-serif;min-height:100vh}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 14px 70px}
  header.top{text-align:center;padding:10px 0 4px}
  header.top h1{font-family:"Noto Serif",serif;font-size:30px;margin:0;color:#fff}
  header.top h1 .lab{color:var(--sky)}
  header.top p{color:var(--mut);margin:6px 0 0;font-size:14px}
  .stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 16px;font-size:13px;color:var(--mut)}
  .stat b{color:#fff;font-size:16px}
  .prog{height:10px;background:var(--panel);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:10px auto 2px;max-width:560px}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--green));width:0%}
  .proglabel{text-align:center;color:var(--mut);font-size:12.5px}
  .controls{position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 78%,transparent);padding:12px 0 8px;z-index:5}
  .search{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);
          color:var(--ink);font-size:15px;font-family:inherit;outline:none}
  .search:focus{border-color:var(--sky)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .tab{border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:99px;padding:7px 14px;
       font-size:13.5px;cursor:pointer;font-family:inherit}
  .tab.on{background:var(--sky);color:#04263c;border-color:var(--sky);font-weight:600}
  .tab.st.on{background:var(--gold);border-color:var(--gold);color:#3a2703}
  .cont{display:none;background:linear-gradient(90deg,#143058,#0f2547);border:1px solid var(--sky);border-radius:16px;
        padding:12px 16px;margin:12px 0 0;cursor:pointer;align-items:center;gap:10px}
  .cont:hover{border-color:#fff}
  .cont .t{font-weight:600}
  .cont .s{color:var(--mut);font-size:13px}
  .count{color:var(--mut);font-size:13px;margin:14px 2px 8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;position:relative}
  .card:hover{border-color:var(--sky);transform:translateY(-1px)}
  .card h3{margin:8px 0 6px;font-size:15.5px;line-height:1.35;font-weight:600}
  .card .meta{color:var(--mut);font-size:12.5px}
  .badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.4px;border-radius:99px;padding:3px 9px;color:#06283d}
  .b1{background:var(--p1)} .b2{background:var(--p2)} .b3{background:var(--p3)} .bS{background:var(--ps)}
  .doneflag{position:absolute;top:12px;right:12px;color:var(--green);font-weight:800;font-size:14px}
  .card.isdone{opacity:.72}
  /* lesson view */
  #lesson{display:none}
  #lesson.open{display:block}
  .lhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 4px}
  .lhead h2{font-family:"Noto Serif",serif;font-size:23px;margin:4px 0 0;width:100%;line-height:1.3}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:12px;padding:9px 15px;
       font-size:14px;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--sky)}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#3a2703;font-weight:700}
  .btn.green{background:var(--green);border-color:var(--green);color:#04331a;font-weight:700}
  .cue{background:#1a1030;border:1px solid #6b4fa8;border-radius:16px;padding:16px;margin:14px 0}
  .cue .k{color:#cdb2ff;font-size:12px;font-weight:800;letter-spacing:1px}
  .cue .task{font-size:17px;font-weight:600;margin:6px 0}
  .cue .say{color:var(--mut);font-size:14px}
  section.blk{margin:20px 0}
  section.blk>h3{font-size:16px;margin:0 0 10px;color:#fff}
  .qa{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px}
  .qa .q{font-weight:600;font-size:15px}
  .qa .a{display:none;color:#d8e9ff;margin-top:8px;line-height:1.55;font-size:14.5px;
         border-top:1px dashed var(--line);padding-top:8px}
  .qa.show .a{display:block}
  .qa .tgl{margin-top:8px;background:none;border:none;color:var(--sky);cursor:pointer;font-size:13px;padding:0;font-family:inherit}
  .para{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;line-height:1.65;
        font-size:14.5px;color:#d8e9ff;margin-bottom:10px}
  .voc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:14px}
  .voc b{color:var(--gold)}
  .voc .ex{display:block;color:var(--mut);font-style:italic;margin-top:3px;font-size:13px}
  .lfoot{position:sticky;bottom:0;padding:12px 0;background:linear-gradient(0deg,var(--bg) 78%,transparent);
         display:flex;gap:10px;flex-wrap:wrap}
  .empty{color:var(--mut);text-align:center;padding:34px 0}
  @media (max-width:560px){ header.top h1{font-size:25px} .grid{grid-template-columns:1fr 1fr} .card h3{font-size:13.5px} }
</style>
</head>
<body>
<div class="wrap">
  <div id="home">
    <header class="top">
      <h1>English <span class="lab">Lab</span></h1>
      <p>Thư viện bài học IELTS Speaking — kho bài của riêng Anita</p>
      <div class="stats">
        <div class="stat"><b id="stTotal">…</b> bài học</div>
        <div class="stat"><b id="stQa">…</b> câu hỏi &amp; đáp án mẫu</div>
        <div class="stat"><b id="stVoc">…</b> cụm từ vựng</div>
      </div>
      <div class="prog"><i id="progBar"></i></div>
      <div class="proglabel" id="progLabel">Đã học 0 bài</div>
    </header>

    <div class="cont" id="contCard">
      <div style="font-size:20px">▶️</div>
      <div><div class="t" id="contTitle"></div><div class="s">Học tiếp bài đang dở</div></div>
    </div>

    <div class="controls">
      <input class="search" id="q" type="search" placeholder="🔍 Tìm bài theo chủ đề… (ví dụ: travel, work, family)">
      <div class="tabs" id="partTabs"></div>
      <div class="tabs" id="stTabs">
        <button class="tab st on" data-st="all">Tất cả</button>
        <button class="tab st" data-st="todo">Chưa học</button>
        <button class="tab st" data-st="done">Đã học</button>
      </div>
    </div>
    <div class="count" id="countLabel"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="emptyMsg" style="display:none">Không tìm thấy bài nào khớp. Thử từ khóa khác nha.</div>
  </div>

  <div id="lesson">
    <div class="lhead">
      <button class="btn" id="backBtn">← Thư viện</button>
      <span class="badge" id="lBadge"></span>
      <span style="flex:1"></span>
      <button class="btn" id="prevBtn">← Bài trước</button>
      <button class="btn" id="nextBtn">Bài sau →</button>
      <h2 id="lTitle"></h2>
    </div>
    <div id="lBody"></div>
    <div class="lfoot">
      <button class="btn gold" id="doneBtn">✓ Đánh dấu đã học xong</button>
      <button class="btn" id="showAllBtn">Hiện tất cả đáp án</button>
    </div>
  </div>
</div>

<script>
"use strict";
const PART_LABEL = {"1":"PART 1","2":"PART 2","3":"PART 3","Special":"ĐẶC BIỆT"};
const PART_CLASS = {"1":"b1","2":"b2","3":"b3","Special":"bS"};
let LITE = [], curPart = "all", curSt = "all", doneSet = new Set(), curLesson = null;
const cache = new Map();
const $ = id => document.getElementById(id);

try { doneSet = new Set(JSON.parse(localStorage.getItem("englab-done") || "[]")); } catch(e) {}
function saveDone(){ localStorage.setItem("englab-done", JSON.stringify([...doneSet])); }

function partTabs(){
  const counts = {"all": LITE.length};
  LITE.forEach(l => counts[l.part] = (counts[l.part]||0)+1);
  const order = [["all","Tất cả"],["1","Part 1"],["2","Part 2"],["3","Part 3"],["Special","Đặc biệt"]];
  $("partTabs").innerHTML = order.filter(([k]) => counts[k]).map(([k,v]) =>
    `<button class="tab ${k===curPart?'on':''}" data-part="${k}">${v} · ${counts[k]}</button>`).join("");
  document.querySelectorAll("#partTabs .tab").forEach(b => b.onclick = () => { curPart = b.dataset.part; partTabs(); render(); });
}
document.querySelectorAll("#stTabs .tab").forEach(b => b.onclick = () => {
  curSt = b.dataset.st;
  document.querySelectorAll("#stTabs .tab").forEach(x => x.classList.toggle("on", x===b));
  render();
});
$("q").addEventListener("input", render);

function filtered(){
  const kw = $("q").value.trim().toLowerCase();
  return LITE.filter(l =>
    (curPart==="all" || l.part===curPart) &&
    (curSt==="all" || (curSt==="done") === doneSet.has(l.id)) &&
    (!kw || l.title.toLowerCase().includes(kw) || l.topic.toLowerCase().includes(kw)));
}
function render(){
  const list = filtered();
  $("countLabel").textContent = `Đang hiện ${list.length} bài`;
  $("emptyMsg").style.display = list.length ? "none" : "block";
  $("grid").innerHTML = list.map(l => `
    <div class="card ${doneSet.has(l.id)?'isdone':''}" data-id="${l.id}">
      <span class="badge ${PART_CLASS[l.part]}">${PART_LABEL[l.part]}</span>
      ${doneSet.has(l.id)?'<span class="doneflag">✓ Đã học</span>':''}
      <h3>${l.title}</h3>
      <div class="meta">${l.cue ? "🗂 Cue card · bài nói mẫu" : `❓ ${l.nq} câu hỏi`}${l.nv ? ` · 📚 ${l.nv} từ vựng` : ""}</div>
    </div>`).join("");
  document.querySelectorAll(".card").forEach(c => c.onclick = () => openLesson(c.dataset.id));
  const pct = LITE.length ? Math.round(doneSet.size / LITE.length * 100) : 0;
  $("progBar").style.width = pct + "%";
  $("progLabel").textContent = `Đã học ${doneSet.size}/${LITE.length} bài (${pct}%)`;
}
function updateStats(){
  $("stTotal").textContent = LITE.length;
  $("stQa").textContent = LITE.reduce((s,l)=>s+l.nq,0).toLocaleString("vi-VN");
  $("stVoc").textContent = LITE.reduce((s,l)=>s+l.nv,0).toLocaleString("vi-VN");
}
function showContinue(){
  const last = localStorage.getItem("englab-last");
  const l = LITE.find(x => x.id === last);
  if (l) { $("contCard").style.display = "flex"; $("contTitle").textContent = l.title; $("contCard").onclick = () => openLesson(l.id); }
}
async function openLesson(id){
  if (!cache.has(id)) cache.set(id, await (await fetch(`data/${id}.json`)).json());
  curLesson = cache.get(id);
  localStorage.setItem("englab-last", id);
  const idx = LITE.findIndex(x => x.id === id);
  $("lBadge").className = "badge " + PART_CLASS[curLesson.part];
  $("lBadge").textContent = PART_LABEL[curLesson.part];
  $("lTitle").textContent = curLesson.title;
  let h = "";
  if (curLesson.cue) h += `<div class="cue"><div class="k">🗂 CUE CARD</div>
    <div class="task">${curLesson.cue.task}</div><div class="say">You should say: ${curLesson.cue.say}</div></div>`;
  if (curLesson.qa.length) {
    h += `<section class="blk"><h3>Câu hỏi &amp; đáp án mẫu (${curLesson.qa.length})</h3>` +
      curLesson.qa.map((it,i) => `<div class="qa" id="qa${i}"><div class="q">${i+1}. ${it.q}</div>
        <button class="tgl" data-i="${i}">👀 Hiện đáp án mẫu</button><div class="a">${it.a}</div></div>`).join("") + `</section>`;
  }
  if (curLesson.paras.length) {
    h += `<section class="blk"><h3>${curLesson.cue ? "Bài nói mẫu (transcript)" : "Nội dung bài"}</h3>` +
      curLesson.paras.map(p => `<div class="para">${p}</div>`).join("") + `</section>`;
  }
  if (curLesson.vocab.length) {
    h += `<section class="blk"><h3>📚 Từ vựng mục tiêu (${curLesson.vocab.length})</h3>` +
      curLesson.vocab.map(v => `<div class="voc"><b>${v.t}</b> — ${v.d}${v.e ? `<span class="ex">Ví dụ: ${v.e}</span>` : ""}</div>`).join("") + `</section>`;
  }
  $("lBody").innerHTML = h;
  document.querySelectorAll(".qa .tgl").forEach(b => b.onclick = () => {
    const box = $("qa" + b.dataset.i); box.classList.toggle("show");
    b.textContent = box.classList.contains("show") ? "🙈 Ẩn đáp án" : "👀 Hiện đáp án mẫu";
  });
  $("prevBtn").disabled = idx <= 0; $("nextBtn").disabled = idx >= LITE.length - 1;
  $("prevBtn").onclick = () => idx > 0 && openLesson(LITE[idx-1].id);
  $("nextBtn").onclick = () => idx < LITE.length - 1 && openLesson(LITE[idx+1].id);
  syncDoneBtn();
  $("home").style.display = "none"; $("lesson").classList.add("open");
  window.scrollTo(0,0);
}
function syncDoneBtn(){
  const d = doneSet.has(curLesson.id);
  $("doneBtn").textContent = d ? "✓ Đã học — bấm để bỏ dấu" : "✓ Đánh dấu đã học xong";
  $("doneBtn").className = "btn " + (d ? "green" : "gold");
}
$("doneBtn").onclick = () => {
  doneSet.has(curLesson.id) ? doneSet.delete(curLesson.id) : doneSet.add(curLesson.id);
  saveDone(); syncDoneBtn();
};
$("showAllBtn").onclick = () => document.querySelectorAll(".qa").forEach(q => q.classList.add("show"));
$("backBtn").onclick = () => { $("lesson").classList.remove("open"); $("home").style.display = "block"; render(); showContinue(); };

fetch("index-lite.json").then(r => r.json()).then(d => { LITE = d; updateStats(); partTabs(); render(); showContinue(); })
  .catch(() => { $("countLabel").textContent = "Không tải được dữ liệu bài học."; });
</script>
</body>
</html>
